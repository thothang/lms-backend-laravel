server {
    listen 80;
    server_name _;

    client_max_body_size 100M;
    client_body_timeout 300s;

    charset utf-8;

    # === BACKEND (LARAVEL API) ===
    # Mọi request bắt đầu bằng /api/ được đẩy về file index.php của Laravel
    location ^~ /api/ {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Phục vụ thư mục hình ảnh và file nội bộ của Laravel (như cover_image)
    location ^~ /storage/ {
        root /var/www/public;
        try_files $uri $uri/ =404;
    }

    # Cấu hình xử lý FastCGI qua mạng nội bộ cho container app:9000
    location ~ \.php$ {
        root /var/www/public;
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # === FRONTEND (REACT VITE) ===
    # Mọi request khác (không phải API/Storage/PHP) sẽ trả về giao diện Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Hỗ trợ React/Vue Router (nếu Reload trang ở đường dẫn con không bị lỗi 404)
        try_files $uri $uri/ /index.html;
    }

    # Chặn không cho web tò mò xem các file log hay env
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
